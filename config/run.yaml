hydra:
  run:
    dir: .

defaults:
  - inference: nn5_daily
  - graph_cfg: default
  - estimators: default
  - _self_

exp_name: ${now:%m-%d-%H-%M-%S}
model_name: amazon/chronos-t5-tiny
result_name: ${now:%m-%d-%H-%M-%S}
batch_size: 64

must_inference_once: false
must_inference_multiple: false
must_construct_graph: false
need_std: false
std_num_runs: 1000
std_seed: 0
need_main: true
dump_u_dict: false

error_metric: mase
mase_seasonality: null
aurc_error_threshold: null
